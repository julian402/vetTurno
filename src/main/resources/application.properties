spring.application.name=vetTurno

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vetturno}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.enabled=true

# JWT: en produccion definir JWT_SECRET (minimo 32 caracteres)
jwt.secret=${JWT_SECRET:vetturno-clave-local-desarrollo-cambiar-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}